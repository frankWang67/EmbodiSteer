# Use a local checkout: pip includes below are relative to this directory.
name: embodisteer-real
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10.14
  - pip=22.1.2
  # Compiled PyAV avoids the source distribution's FFmpeg header dependency.
  - av=10.0.0
  - cmake<3.28
  - llvm-openmp=14
  - exiftool=12.76
  - pip:
    - -r real-requirements.txt
