[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embodisteer"
version = "0.1.0"
description = "Cross-embodiment manipulation with online kinematic and collision guidance"
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["embodisteer*", "diffusion_policy*", "umi*"]
namespaces = true
