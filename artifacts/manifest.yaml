schema_version: 1
project: EmbodiSteer
status: metadata_only

# Checkpoints and training data are intentionally not published in this
# release. Keep this file machine-readable so a future artifact release can be
# added without changing the documentation contract.
publication:
  checkpoints: not_published
  training_data: not_published
  evaluation_outputs: not_published

artifacts: []

required_fields_when_published:
  - id
  - type
  - task
  - revision
  - size_bytes
  - url
  - license
  - access
