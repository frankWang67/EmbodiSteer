schema_version: 1

# PickPlaceToasterToCounter EmbodiSteer profile used in the reference evaluation.
policy:
  inference_space: joint
  num_inference_steps: 16

  guidance:
    method: cbf
    scale: 1.5
    use_schedule: true
    schedule_midpoint: 0.7
    schedule_steepness: 50.0
    safety_margin: 0.05
    activation_distance: 1.0
    grad_clip: 0.1
    cbf_lambda: 0.01
    sdf_agg: topk
    sdf_softmax_temp: 20.0
    sdf_topk: 4
    task_pos_weight: 1.0
    task_rot_weight: 0.1

  baseline:
    method: ""

  ik:
    jacobian_damping: 0.001
    position_threshold: 0.0005
    rotation_threshold: 0.005
    num_seeds: 1
    jac_noise_alpha: 0.1
    max_dq_per_step: 0.5
