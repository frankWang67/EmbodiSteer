name: Deployment boundaries
on: [push, pull_request]
permissions:
  contents: read
jobs:
  config-and-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      # Intentionally no torch, simulation SDKs or hardware drivers. This is
      # boundary CI, not a substitute for clean CUDA profile smoke tests.
      - run: python -m pip install click==8.3.1 pyyaml==6.0 numpy==1.26.4 pytest
      - run: python -m pytest -q tests/test_deployment_boundaries.py tests/test_real_preflight.py
